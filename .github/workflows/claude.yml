# Repo Manager — cloud runner
# Copy to .github/workflows/claude.yml in each tracked repository (or let `/install-github-app`
# create the file, then merge these guardrails in). Requires the Claude GitHub App on the repo and
# the CLAUDE_CODE_OAUTH_TOKEN secret (from `claude setup-token`), or ANTHROPIC_API_KEY.
#
# Trigger: an issue opened by the dashboard with `@claude` in its body (run:cloud), or any later
# comment containing `@claude` (follow-ups from the dashboard's TODO panel).
# Guardrails: turn cap, job timeout, one run per issue at a time, and the instructions in the issue
# body (mode:implement → branch + PR only; mode:plan → comment only, no file changes).
# Model and effort: from the issue's model:<name> and effort:<level> labels (set from the dashboard);
# claude-opus-5 and xhigh when it has none, as on a pull request review comment.

name: Claude Code (Repo Manager)
on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

jobs:
  claude:
    if: |
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude'))) ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - id: run
        name: Model and effort from the issue's labels
        run: |
          names=$(jq -r '((.issue // .pull_request // {}).labels // [])[].name' "$GITHUB_EVENT_PATH")
          model=$(sed -n 's/^model://p' <<<"$names"); effort=$(sed -n 's/^effort://p' <<<"$names")
          if [ "$(wc -l <<<"$model")" -gt 1 ] || [ "$(wc -l <<<"$effort")" -gt 1 ]; then
            echo "::error::The issue has more than one model: or effort: label; remove all but one."; exit 1; fi
          model=${model:-claude-opus-5}; effort=${effort:-xhigh}
          [[ $model =~ ^[a-z0-9][a-z0-9.-]*$ ]] || { echo "::error::Label model:$model is not a model name."; exit 1; }
          [[ $effort =~ ^(low|medium|high|xhigh|max)$ ]] || { echo "::error::Label effort:$effort is not low, medium, high, xhigh or max."; exit 1; }
          echo "Running $model, effort $effort"
          echo "args=--model $model --effort $effort" >> "$GITHUB_OUTPUT"
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # For an API key instead: anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: |
            --max-turns 40
            ${{ steps.run.outputs.args }}
            --append-system-prompt "Repository rules: never commit to the default branch; for implementation requests create a branch named claude/todo-<issue number> and open a pull request; when the issue says 'Mode: plan only', do not modify or create files and do not open a pull request — reply with the plan as a comment. State in your final comment exactly what was verified and how."
